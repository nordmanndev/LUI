<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUI sample</title>
  <meta name="description" content="Nordmann.LUI: autocomplete on SQLite FTS5, with flexdatalist.">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/flexdatalist.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="top">
    <div>
      <h1>LUI <span>sample</span></h1>
      <p>Autocomplete on SQLite FTS5 — <code>Nordmann.LUI</code> behind a <a href="https://github.com/sergiodlopes/flexdatalist">flexdatalist</a> input.</p>
    </div>
    <nav aria-label="Project">
      <a href="https://github.com/nordmanndev/LUI">Repository</a>
      <a href="https://github.com/nordmanndev/LUI/blob/main/docs/spec/LUI-Spezifikation.md">Specification</a>
    </nav>
  </header>

  <main class="layout">
    <div class="column">
      <section class="card stage" aria-label="Autocompletes">
        <div id="tabs" class="tabs" role="tablist" aria-label="Autocompletes"></div>
        <div id="scenario" class="scenario"></div>
      </section>
      <section id="envelope" class="card" aria-label="The result of the last query"></section>
      <section id="hits" class="card" aria-label="The hits of the last query"></section>
      <section id="activity" class="card" aria-label="Requests"></section>
      <section id="indexes" class="card" aria-label="Indexes"></section>
    </div>

    <aside id="settings" class="card settings" aria-label="Settings"></aside>
  </main>

  <noscript><p class="error">This page is a demonstration of a JavaScript input and needs JavaScript.</p></noscript>
</body>
</html>
