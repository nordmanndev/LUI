name: Publish

# The tag is the owner's decision: the version in the tag must match the
# version in Directory.Build.props, and the push needs the NUGET_API_KEY
# secret. Nothing here runs without a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Pack · Push to nuget.org
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup
        with:
          restore: 'false'

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          props="$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "props=${props}" >> "$GITHUB_OUTPUT"
          if [ "${tag}" != "${props}" ]; then
            echo "The tag (${tag}) and Directory.Build.props (${props}) disagree." >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore Lui.sln

      # The release gate runs the full parity: every word of the German word
      # list against the live tokenizer. The pull request gate runs the
      # sample; this one does not take chances.
      - name: Fetch the word list
        run: bash tools/fetch-wordlist.sh

      - name: Build and test
        env:
          LUI_REQUIRE_FULL_WORDLIST: '1'
        run: |
          dotnet build Lui.sln --configuration Release --no-restore
          dotnet test Lui.sln --configuration Release --no-build --blame-hang-timeout 10m --blame-hang-dump-type full \
            --results-directory artifacts/test-results

      # Only a failure leaves something worth reading: the dump of a hang, the output of a test.
      - name: Upload the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-test-results
          path: artifacts/test-results
          retention-days: 14

      # No separate pack: the smoke test packs both packages (ADR-0018) into artifacts/nuget, installs and runs
      # exactly those, and they are what is pushed (review of main after #23, finding 7).
      - name: Smoke test the package
        run: bash tools/package-smoke-test.sh "${{ steps.version.outputs.tag }}"

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push artifacts/nuget/*.nupkg \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push artifacts/nuget/*.snupkg \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
