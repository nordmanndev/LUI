# The lane of the schedule for the targets of §16 (ADR-0041). The file stood at
# tools/performance-lane.yml until the owner gave the agent a token: the connector may not write
# into .github/workflows/, and a lane that lives outside of it never runs.
#
name: Performance

# The targets of §16 run on a schedule of their own: the sizes are asserted on
# every runner, the times are reported with the machine they were measured on
# (ADR-0041). The record of the numbers stays docs/benchmarks.md — a lane that
# runs without writing down what it measured proves nothing.
on:
  schedule:
    # 03:17 UTC — a time when nobody waits for a runner.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      entries:
        description: 'How many entries the scenario builds'
        required: false
        default: '3000000'
      machine:
        description: "The machine: 'measurement' asserts every target, 'other' reports the times"
        required: false
        default: 'other'

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budgets:
    name: The budgets of §16
    runs-on: ubuntu-24.04
    # sized by the first run (issue #99): the tests took 8.3 minutes on a hosted runner (4 cores, 15 GB, 85 GB of disk),
    # the whole job about 9 — thirty minutes are three times that
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # The whole word list, or the corpus of the scenario is not the corpus of
      # the specification: the script fails if the list is short. The fetch is
      # the guard — there is no switch that demands the list (ADR-0058, D19).
      - name: Fetch the word list
        run: bash tools/fetch-wordlist.sh

      # The scenario of the run is a file, not a variable (ADR-0058): the lane
      # writes it, the run reads it, and the diff of the file is the diff of
      # the scenario. The copy in the repository is the default.
      - name: The scenario of this run
        run: |
          set -euo pipefail
          cat > tests/Nordmann.LUI.Performance.Tests/performance.scenario.json <<'JSON'
          {
            "note": "The scenario of a measurement run (ADR-0058): the corpus, the prefix length and the settings of the run. It replaces the variables of the environment — a variable is invisible in the code and in the report, a file is a thing one can read, check in and diff. The lane of the schedule writes this file before it measures; the copy that is checked in is the default, and a run without the lane works with it.",
            "scenario": {
              "corpus": "wordlist",
              "prefixLength": 685739,
              "kind": "single",
              "entries": ${{ inputs.entries || '3000000' }},
              "batch": 10000,
              "weights": "longtail",
              "optimize": false,
              "machine": "${{ inputs.machine || 'other' }}",
              "database": ""
            }
          }
          JSON

      - name: Build
        run: dotnet build Lui.sln --configuration Release --no-restore

      # The machine of this run, written down: a number without a machine is a
      # rumour (docs/benchmarks.md).
      - name: The machine of this run
        run: |
          set -euo pipefail
          {
            echo "cores: $(nproc)"
            echo "memory: $(free -g | awk '/^Mem:/ {print $2}') GB"
            echo "disk: $(df -BG / | awk 'NR==2 {print $4}') free"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The pipe needs pipefail: without it a failing test would look green,
      # because tee was the last command of the line.
      - name: The budgets of §16
        run: |
          set -euo pipefail
          mkdir -p artifacts/test-results
          dotnet test tests/Nordmann.LUI.Performance.Tests \
            --configuration Release --no-build \
            --filter 'BudgetPerformance' \
            --logger "console;verbosity=detailed" --blame-hang-timeout 20m --blame-hang-dump-type full \
            --results-directory artifacts/test-results 2>&1 | tee artifacts/test-results/budgets.log

      # Only a failure leaves something worth reading: the dump of a hang, and the log of the run, which is written beside
      # it — the first failed run uploaded nothing, because without a dump the folder stayed empty (issue #99).
      - name: Upload the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-test-results
          path: artifacts/test-results
          retention-days: 14

      - name: The result in the summary of the run
        if: always()
        run: |
          set -euo pipefail
          {
            echo '### The budgets of §16'
            echo ''
            echo '```text'
            grep -F '[perf]' artifacts/test-results/budgets.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
