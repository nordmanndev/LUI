name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Test · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Lui.sln

      - name: Build
        run: dotnet build Lui.sln --configuration Release --no-restore

      # The three lanes of the pyramid (ADR-0019). The unit lane is the fast
      # one — the rules of the library, without a database. The architecture
      # tests read the repository from disk — they are the mechanical half of
      # the standards' rules (ADR-0002) and the guard of the map of the tests.
      - name: Test · unit
        run: >
          dotnet test tests/Nordmann.LUI.Unit.Tests
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit.trx"
          --results-directory artifacts/test-results

      - name: Test · architecture
        run: >
          dotnet test tests/Nordmann.LUI.Architecture.Tests
          --configuration Release
          --no-build
          --logger "trx;LogFileName=architecture.trx"
          --results-directory artifacts/test-results

      - name: Test · integration
        run: >
          dotnet test tests/Nordmann.LUI.Integration.Tests
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration.trx"
          --results-directory artifacts/test-results

      # The modules of the sample's client (ADR-0027): plain Node, nothing to install. Node 22 is on the runner image; the
      # step names it so that a change of the image does not change the lane unnoticed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test · sample client
        working-directory: samples/Lui.Sample
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14

      - name: Format
        run: dotnet format Lui.sln --verify-no-changes --no-restore

  parity:
    name: The normalisation parity over the whole word list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Lui.sln

      # The rule of §6.2 exists twice — as SQL and as C# — and the parity test
      # compares them over every word of the German word list. Without the
      # list the test is skipped and says so; this job fetches the list and
      # demands it, so that the parity is proved here and not only in the
      # release gate (ADR-0019).
      - name: Fetch the word list
        run: bash tools/fetch-wordlist.sh

      - name: Build and test
        env:
          LUI_REQUIRE_FULL_WORDLIST: '1'
        run: |
          dotnet build Lui.sln --configuration Release --no-restore
          dotnet test tests/Nordmann.LUI.Integration.Tests --configuration Release --no-build

  mutation:
    name: The guards bite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Every rule is mutated and the guard has to react. A green test proves
      # nothing until it has been seen red (ADR-0019).
      - name: Mutation check
        run: bash tools/mutation-check.sh

  package:
    name: Package · Smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Packs the package, installs it into a throwaway application from a
      # local feed and runs it. The README's code is part of this test from
      # PR-010 on.
      - name: Package smoke test
        run: bash tools/package-smoke-test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/nuget/*.nupkg
          retention-days: 14

  # The other platform (issue #67): the paths, the pragmas and the case of the file names
  # are promises that only Windows can break. The three layers run there — the unit, the
  # architecture and the integration one.
  #
  # The format check and the client of the sample stay on Linux: the runner checks the tree
  # out with CRLF, and `dotnet format` would report the line endings of the tree instead of
  # the format of the code.
  windows:
    name: Windows · the paths, the pragmas, the names of the files
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Lui.sln

      - name: Build
        run: dotnet build Lui.sln --configuration Release --no-restore

      - name: Test · unit
        run: >
          dotnet test tests/Nordmann.LUI.Unit.Tests
          --configuration Release
          --no-build

      # The architecture tests read the repository from disk — the paths of the map of the
      # tests, the files of the packages, the links of the documentation.
      - name: Test · architecture
        run: >
          dotnet test tests/Nordmann.LUI.Architecture.Tests
          --configuration Release
          --no-build

      # The integration layer against a real SQLite file: the pragmas of the connections and
      # the lifetime of the file are what the platform decides.
      - name: Test · integration
        run: >
          dotnet test tests/Nordmann.LUI.Integration.Tests
          --configuration Release
          --no-build
