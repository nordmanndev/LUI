name: CI

# The gates of every pull request — and of the release, which calls this workflow (workflow_call) instead of keeping a
# gate of its own (issue #75).
on:
  push:
    # The pull requests of the series branch from `dev` and target `dev`; `dev` → `main` is the release pull request.
    # Without `dev` here, not one pull request of the series is checked at all.
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    # The probe of the measured window (issue #134): the allocation of the measure landed
    # inside a measured window once, in one run, out of many. A dispatch that asks for the
    # probe runs the probe alone — the unit lane with the probe armed — and no other lane.
    # The number of the runs is part of the evidence.
    inputs:
      allocation_probe:
        description: 'The probe of the measured window alone (issue #134)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
  workflow_call:

permissions:
  contents: read

concurrency:
  # a call from the release runs in the group of the release, not in the one of a pull request
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The rules of every job (issue #74, ADR-0047):
# - the images are named, not "latest": a new image is a change of the repository, not of the weather;
# - every action is pinned by its commit, the version stands beside it; Dependabot moves both;
# - every job has a timeout, and every test run a hang timeout that leaves a full dump behind — the dump type is named,
#   because its default differs between machines (review of pull request 83);
# - the SDK is the one of global.json, through the setup action.
#
# The probe of the measured window (issue #134) is the one dispatch that runs a lane alone: a
# dispatch that asks for it runs the job "The probe" and skips every other gate. The gate of a
# pull request is not weakened by that — a pull request never asks for the probe.
jobs:
  format:
    name: Format
    if: github.event.inputs.allocation_probe != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # First and on its own: a format error is reported in a minute, not after every test.
      - name: Format
        run: dotnet format Lui.sln --verify-no-changes --no-restore

  # The workflows themselves (issue #75, ADR-0048): publish.yml runs only on a tag — a mistake in it would be found at
  # the release, not before. actionlint reads every workflow on every pull request. The binary is the release of
  # actionlint, checked against the checksum of that release. The download retries a transient error and says, when it
  # fails, which address answered what (issue #91: three 504s of github.com in a row).
  workflows:
    name: Workflows · actionlint
    if: github.event.inputs.allocation_probe != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 5 --retry-delay 10 -w 'curl: %{http_code} %{url_effective}\n' \
            -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  build:
    name: Build · Test
    if: github.event.inputs.allocation_probe != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Build
        run: dotnet build Lui.sln --configuration Release --no-restore

      # The three lanes of the pyramid (ADR-0019). The unit lane is the fast
      # one — the rules of the library, without a database. The architecture
      # tests read the repository from disk — they are the mechanical half of
      # the rules of the repository (ADR-0002) and the guard of the map of the
      # tests. A test that hangs for ten minutes is stopped, and its dump is
      # uploaded.
      - name: Test · unit
        run: >
          dotnet test tests/Nordmann.LUI.Unit.Tests
          --configuration Release
          --no-build
          --blame-hang-timeout 10m --blame-hang-dump-type full
          --logger "trx;LogFileName=unit.trx"
          --results-directory artifacts/test-results

      - name: Test · architecture
        run: >
          dotnet test tests/Nordmann.LUI.Architecture.Tests
          --configuration Release
          --no-build
          --blame-hang-timeout 10m --blame-hang-dump-type full
          --logger "trx;LogFileName=architecture.trx"
          --results-directory artifacts/test-results

      - name: Test · integration
        run: >
          dotnet test tests/Nordmann.LUI.Integration.Tests
          --configuration Release
          --no-build
          --blame-hang-timeout 10m --blame-hang-dump-type full
          --logger "trx;LogFileName=integration.trx"
          --results-directory artifacts/test-results

      # The sample application against its API, on a real Kestrel (issue #76): its tests sit beside it.
      - name: Test · sample
        run: >
          dotnet test samples/Lui.Sample.Tests
          --configuration Release
          --no-build
          --blame-hang-timeout 10m --blame-hang-dump-type full
          --logger "trx;LogFileName=sample.trx"
          --results-directory artifacts/test-results

      # The modules of the sample's client (ADR-0027): plain Node, nothing to install. The version is exact, so that a
      # new release of Node does not change the lane unnoticed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'

      - name: Test · sample client
        working-directory: samples/Lui.Sample
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14

  # The probe of the measured window (issue #134): the unit lane with the probe armed. The
  # probe measures a hundred windows of the shape of the window of the rule and writes the
  # delta of every iteration down — the buffer of the deltas is allocated before the window,
  # the report is written after it. A dispatch asks for it with the input allocation_probe=1;
  # every other lane is skipped then, and the report of the run is in the artifact.
  allocation-probe:
    name: The probe of the measured window
    if: github.event.inputs.allocation_probe == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Build
        run: dotnet build Lui.sln --configuration Release --no-restore

      # The unit lane of the gate, with the probe switched on. A test that hangs for ten
      # minutes is stopped, and its dump is uploaded.
      - name: Test · unit with the probe armed
        env:
          LUI_ALLOCATION_PROBE: '1'
        run: >
          dotnet test tests/Nordmann.LUI.Unit.Tests
          --configuration Release
          --no-build
          --blame-hang-timeout 10m --blame-hang-dump-type full
          --logger "trx;LogFileName=unit.trx"
          --results-directory artifacts/test-results

      # The report of the probe is in the folder: it names the window that was dirty, the
      # iteration of it that allocated, and the amount.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allocation-probe
          path: artifacts/test-results
          retention-days: 14

  parity:
    name: The normalisation parity over the whole word list
    if: github.event.inputs.allocation_probe != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # The rule of ADR-0005 exists twice — as SQL and as C# — and the parity test
      # compares them over every word of the German word list. Without the
      # list the test is skipped and says so; this job fetches the list and
      # demands it, so that the parity is proved here and not only in the
      # release gate (ADR-0019). The fetch is the guard: it checks the 685,829
      # lines and fails loudly (ADR-0058, D19). The rest of the integration layer —
      # the other tests of the parity too — runs in the job "Build · Test": this
      # one runs the test of the whole list, and nothing twice.
      - name: Fetch the word list
        run: bash tools/fetch-wordlist.sh

      - name: Build and test
        run: |
          dotnet build tests/Nordmann.LUI.Integration.Tests --configuration Release --no-restore
          dotnet test tests/Nordmann.LUI.Integration.Tests --configuration Release --no-build \
            --filter "FullyQualifiedName~NormalizationParityTests.The_normalizer_and_the_tokenizer_agree_on_the_full_word_list" \
            --blame-hang-timeout 10m --blame-hang-dump-type full \
            --results-directory artifacts/test-results

      # Only a failure leaves something worth reading: the dump of a hang, the output of a test.
      - name: Upload the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-test-results
          path: artifacts/test-results
          retention-days: 14

  mutation:
    name: The guards bite (${{ matrix.shard }}/4)
    if: github.event.inputs.allocation_probe != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # Every rule is mutated and the guard has to react — the way each mutation
      # expects: caught by its test, or refused by the build with a named error
      # (issue #73). A green test proves nothing until it has been seen red
      # (ADR-0019). Four shards side by side: every mutation runs in one of them.
      - name: Mutation check
        run: bash tools/mutation-check.sh --shard ${{ matrix.shard }}/4

  # The one row of the mutations, whatever the number of the shards.
  mutation-result:
    name: The guards bite
    if: always() && github.event.inputs.allocation_probe != '1'
    needs: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard of the mutation check is green
        run: |
          if [ "${{ needs.mutation.result }}" != "success" ]; then
            echo "The mutation check is ${{ needs.mutation.result }} — read the shard that failed." >&2
            exit 1
          fi

  package:
    name: Package · Smoke test
    if: github.event.inputs.allocation_probe != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The smoke test packs and restores on its own, from a local feed — the setup gives it the SDK and the cache.
      - uses: ./.github/actions/setup
        with:
          restore: 'false'

      # Packs the package, installs it into a throwaway application from a
      # local feed and runs it. The README's code is part of this test from
      # PR-010 on. It needs nothing of the other jobs, so it runs beside them.
      - name: Package smoke test
        run: bash tools/package-smoke-test.sh

      # The C# blocks of the tutorial are compiled and run against the library,
      # and what they print is compared with the pages (issue #128): a block
      # that names an API the library does not have fails the lane.
      - name: Tutorial check
        run: python3 tools/tutorial-check.py

      # The naming of a failing test (issue #154): a test of the integration layer failed once under load,
      # and the name of it was lost with the output of that run. The procedure of the run under load has to
      # name the test that failed — the self-test of the tool proves that it does.
      - name: The naming of a failing test
        run: bash tools/load-run.sh --self-test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: artifacts/nuget/*.nupkg
          retention-days: 14

  # The other platform (issue #67): the paths, the pragmas and the case of the file names
  # are promises that only Windows can break. The three layers run there — the unit, the
  # architecture and the integration one — and the tests of the sample.
  #
  # The format check and the client of the sample stay on Linux: the runner checks the tree
  # out with CRLF, and `dotnet format` would report the line endings of the tree instead of
  # the format of the code.
  windows:
    name: Windows · the paths, the pragmas, the names of the files
    if: github.event.inputs.allocation_probe != '1'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Build
        run: dotnet build Lui.sln --configuration Release --no-restore

      - name: Test · unit
        run: >
          dotnet test tests/Nordmann.LUI.Unit.Tests
          --configuration Release
          --no-build
          --blame-hang-timeout 10m --blame-hang-dump-type full
          --results-directory artifacts/test-results

      # The architecture tests read the repository from disk — the paths of the map of the
      # tests, the files of the packages, the links of the documentation.
      - name: Test · architecture
        run: >
          dotnet test tests/Nordmann.LUI.Architecture.Tests
          --configuration Release
          --no-build
          --blame-hang-timeout 10m --blame-hang-dump-type full
          --results-directory artifacts/test-results

      # The integration layer against a real SQLite file: the pragmas of the connections and
      # the lifetime of the file are what the platform decides.
      - name: Test · integration
        run: >
          dotnet test tests/Nordmann.LUI.Integration.Tests
          --configuration Release
          --no-build
          --blame-hang-timeout 10m --blame-hang-dump-type full
          --results-directory artifacts/test-results

      - name: Test · sample
        run: >
          dotnet test samples/Lui.Sample.Tests
          --configuration Release
          --no-build
          --blame-hang-timeout 10m --blame-hang-dump-type full
          --results-directory artifacts/test-results

      # Only a failure leaves something worth reading: the dump of a hang, the output of a test.
      - name: Upload the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results
          path: artifacts/test-results
          retention-days: 14
